<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon</title>

    <!-- Rubik Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --green: #3a5536;
        --cream: #f0eada;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Rubik", sans-serif;
      }

      body {
        background-color: var(--cream);
        color: var(--green);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        text-align: center;
        padding: 2rem 3rem;
        border-radius: 2rem;
        background: rgba(255, 255, 255, 0.6);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        width: 100%;
      }

      h1 {
        font-size: 3rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin-bottom: 1rem;
        display: inline-block;
        cursor: default;
        transition:
          transform 0.3s ease,
          color 0.3s ease;
      }

      h1:hover {
        transform: scale(1.05);
      }

      p {
        font-size: 1.1rem;
        font-weight: 400;
        line-height: 1.6;
        margin-bottom: 2rem;
      }

      .tagline {
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.85rem;
        opacity: 0.8;
      }

      .divider {
        width: 60px;
        height: 3px;
        background-color: var(--green);
        margin: 1.5rem auto;
        border-radius: 999px;
      }

      @media (max-width: 480px) {
        h1 {
          font-size: 2.2rem;
        }
        p {
          font-size: 1rem;
        }
        .container {
          padding: 2rem;
        }
      }

      /* Liquid hover effect using SVG filter */
      h1 {
        font-size: 3rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin-bottom: 1rem;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="tagline">Lily Living</div>
      <h1 id="liquidText">Coming Soon</h1>
      <div class="divider"></div>
      <p>
        We're working on something great.<br />
        Stay tuned — our new site is launching soon.
      </p>
    </div>
  </body>
</html>
